# shellcheck shell=bash
# リポジトリ固有のハーネス設定。
# 共有スクリプト（scripts/lib/*.sh・フック・check-*.sh）はリポジトリ間で同一に保ち、
# リポジトリごとに異なる値はこのファイルだけに置く（依存性逆転：共有側は値の出どころを知らない）。

# PR 経由でのみ更新するブランチ
HARNESS_PROTECTED_BRANCHES='main|dev'

# Git 管理下に置いてはいけないパス（非公開のモック・依存物・ビルド成果物）
HARNESS_FORBIDDEN_PATHS='(^|/)node_modules/|^reference/mock/|^target/'

# エージェントに直接編集させないパス。"<glob>::<理由>" の形で並べる
HARNESS_FROZEN_PATHS=(
  'reference/mock/*::reference/mock/ は凍結した非公開の仕様書です（ADR-0002）。挙動の変更は ADR を追加してから行ってください。'
  'reference/golden/*.json::ゴールデン JSON は生成物です。reference/golden/cases/ にケースを足し node reference/tools/gen-golden.mjs で再生成してください。'
  '*package-lock.json::lock ファイルは手で編集せず、npm コマンドで更新してください。'
  'Cargo.lock::lock ファイルは手で編集せず、cargo コマンドで更新してください。'
)

# この正規表現に合う変更があるとき、停止前に高速チェックを走らせる
HARNESS_VERIFY_TRIGGER='(\.(rs|ts|mjs|sh|bats)$|Cargo\.(toml|lock)$|package(-lock)?\.json$|^(scripts|reference|tests)/|^\.claude/hooks/)'

# ブロック時に案内するドキュメント
HARNESS_STRATEGY_DOC='docs/development/branching-strategy.md'

# 内容を同一に保つ相手リポジトリ（scripts/check-shared-sync.sh）
HARNESS_SHARED_WITH='modelith/plugin-sdk'
