# shellcheck shell=bash
# テスト用のハーネス設定。共有スクリプトのテストはリポジトリ固有の scripts/harness.conf ではなく、
# この固定値を使う（テストをリポジトリ間で同一に保つため）。
HARNESS_PROTECTED_BRANCHES='main|dev'
HARNESS_FORBIDDEN_PATHS='(^|/)node_modules/|^secret/|^target/'
HARNESS_FROZEN_PATHS=(
  'frozen/*::frozen/ は凍結されています。'
  '*package-lock.json::lock ファイルは手で編集しないでください。'
)
HARNESS_VERIFY_TRIGGER='(\.(rs|sh)$|^scripts/)'
HARNESS_STRATEGY_DOC='docs/strategy.md'
HARNESS_SHARED_WITH='example/other'
