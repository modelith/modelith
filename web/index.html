<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title data-l10n="shell-title"></title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='30' fill='%2316293F'/%3E%3Cpath d='M34 92 L34 42 L64 72' fill='none' stroke='%23FFFFFF' stroke-width='13' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M64 72 L94 42 L94 92' fill='none' stroke='%232ED3B7' stroke-width='13' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div id="loading" role="status" aria-live="polite" data-l10n="shell-loading"></div>
<div class="app">
  <header>
    <h1><svg class="logo" viewBox="0 0 128 128" width="26" height="26" aria-hidden="true"><rect width="128" height="128" rx="30" fill="#16293F"></rect><path d="M34 92 L34 42 L64 72" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path><path d="M64 72 L94 42 L94 92" fill="none" stroke="#2ED3B7" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="name">Modelith</span></h1>
    <button class="menutoggle" id="menuToggle" data-l10n-aria-label="shell-menu" aria-expanded="false" aria-controls="menubar" data-l10n-title="shell-menu">☰</button>
    <nav class="menubar" id="menubar" data-l10n-aria-label="shell-menu">
      <details class="menu" id="fileMenu">
        <summary data-l10n="shell-menu-file"></summary>
        <div class="pop">
          <button id="btnNew" data-l10n="shell-new-file"></button>
          <button id="btnOpen"><span data-l10n="shell-open-file-dots"></span><span class="kbd">Ctrl+O</span></button>
          <button id="btnOpenFolder" data-l10n="shell-open-folder-dots"></button>
          <div id="recentMenu" class="recent"></div>
          <button id="btnCloseFolder" hidden data-l10n="shell-close-folder"></button>
          <div class="sep"></div>
          <button id="btnSave"><span data-l10n="shell-save"></span><span class="kbd">Ctrl+S</span></button>
          <button id="btnSaveAs"><span data-l10n="shell-save-as"></span><span class="kbd">Ctrl+Shift+S</span></button>
          <label class="check"><input type="checkbox" id="autoSave"> <span data-l10n="shell-auto-save"></span></label>
          <div class="sep"></div>
          <button id="btnExport" data-l10n-title="shell-export-hint" data-l10n="shell-export-dots"></button>
          <div class="sep"></div>
          <button id="btnSample" data-l10n="shell-open-sample"></button>
          <label class="check" data-l10n-title="shell-start-sample-hint"><input type="checkbox" id="startSample"> <span data-l10n="shell-start-sample"></span></label>
          <div class="note" id="fileNote"></div>
        </div>
      </details>
      <details class="menu" id="editMenu">
        <summary data-l10n="shell-menu-edit"></summary>
        <div class="pop">
          <button id="menuUndo" disabled><span data-l10n="shell-undo"></span><span class="kbd">Ctrl+Z</span></button>
          <button id="menuRedo" disabled><span data-l10n="shell-redo"></span><span class="kbd">Ctrl+Shift+Z</span></button>
          <div class="sep"></div>
          <button id="menuSelectAll" data-l10n-title="shell-select-all-hint"><span data-l10n="shell-select-all"></span><span class="kbd">Ctrl+A</span></button>
        </div>
      </details>
      <details class="menu" id="viewMenu">
        <summary data-l10n="shell-menu-view"></summary>
        <div class="pop">
          <button id="togTree" class="hide-narrow" aria-pressed="true" data-l10n-title="shell-toggle-tree-hint" data-l10n="shell-tree"></button>
          <button id="togText" class="hide-narrow" aria-pressed="true" data-l10n-title="shell-toggle-text-hint" data-l10n="shell-text"></button>
          <div class="sep hide-narrow"></div>
          <button id="menuZoomIn" data-l10n="shell-zoom-in"></button>
          <button id="menuZoomOut" data-l10n="shell-zoom-out"></button>
          <button id="menuFit" data-l10n="shell-fit"></button>
          <button id="menuMini" aria-pressed="true" data-l10n-title="shell-toggle-minimap-hint" data-l10n="shell-minimap"></button>
          <div class="phead" data-l10n="shell-edge-shape"></div>
          <button id="menuEdgeOrtho" aria-pressed="true" data-l10n-title="shell-edge-ortho-hint" data-l10n="shell-edge-ortho"></button>
          <button id="menuEdgeCurve" aria-pressed="false" data-l10n-title="shell-edge-curve-hint" data-l10n="shell-edge-curve"></button>
          <div class="sep"></div>
          <button id="menuLevels" data-l10n-title="shell-levels-hint" data-l10n="shell-levels-dots"></button>
        </div>
      </details>
      <details class="menu" id="diagramMenu">
        <summary data-l10n="shell-menu-diagram"></summary>
        <div class="pop">
          <button id="menuSaveView" data-l10n-title="shell-new-diagram-hint" data-l10n="shell-new-diagram-dots"></button>
          <button id="menuLayout" data-l10n-title="shell-layout-hint" data-l10n="shell-layout"></button>
        </div>
      </details>
      <details class="menu" id="pluginMenu">
        <summary data-l10n="shell-menu-plugins"></summary>
        <div class="pop">
          <button id="btnPlugins" data-l10n="shell-plugin-list-dots"></button>
          <div id="pluginCommands" hidden></div>
        </div>
      </details>
      <details class="menu" id="helpMenu">
        <summary data-l10n="shell-menu-help"></summary>
        <div class="pop">
          <a href="https://github.com/modelith/modelith/issues/new/choose" target="_blank" rel="noopener" data-l10n="shell-help-feedback"></a>
          <a href="reports/requirements.html" target="_blank" rel="noopener" data-l10n="shell-help-test-results"></a>
          <button id="btnUsage" data-l10n="shell-help-usage" hidden></button>
          <a id="sourceLink" href="https://github.com/modelith/modelith" target="_blank" rel="noopener" data-l10n="shell-help-source"></a>
          <a id="licenseLink" href="https://github.com/modelith/modelith#license" target="_blank" rel="noopener" data-l10n="shell-help-license"></a>
          <a id="noticesLink" href="licenses.txt" target="_blank" rel="noopener" data-l10n="shell-help-notices"></a>
          <div class="about" id="legal"><span id="appCopyright"></span><br><b data-l10n="shell-no-warranty"></b><span data-l10n="shell-redistribute"></span></div>
          <div class="about" id="trademarks" data-l10n="shell-trademarks"></div>
          <div class="about">Modelith <span id="appVersion"></span><span id="stageNote"></span><br><span data-l10n="shell-about-drafts"></span></div>
        </div>
      </details>
    </nav>
    <div class="undo" role="group" data-l10n-aria-label="shell-history">
      <button id="btnUndo" data-l10n-title="shell-undo-hint" data-l10n-aria-label="shell-undo" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button id="btnRedo" data-l10n-title="shell-redo-hint" data-l10n-aria-label="shell-redo" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    </div>
    <div class="spacer"></div>
    <div class="sync" id="sync" data-l10n-title="shell-sync-hint"><i></i><span id="syncText" data-l10n="shell-sync-done"></span></div>
    <span class="badge" id="stageBadge" hidden></span>
    <div class="tabs" role="group" data-l10n-aria-label="shell-pane-switch">
      <button id="tabTree" aria-pressed="false" data-l10n="shell-tree"></button>
      <button id="tabDiagram" aria-pressed="true" data-l10n="shell-diagram"></button>
      <button id="tabText" aria-pressed="false" data-l10n="shell-text"></button>
    </div>
    <input type="file" id="fileInput" accept=".sysml,.kerml,.txt,.json,text/plain,application/json" multiple hidden>
    <input type="file" id="pluginFileInput" hidden>
    <input type="file" id="pluginDirInput" webkitdirectory hidden>
  </header>
  <main id="main" data-tab="diagram">
    <aside class="pane treepane" data-l10n-aria-label="shell-sidebar">
      <div class="sidetabs" role="tablist" data-l10n-aria-label="shell-sidebar-switch">
        <button id="sideFiles" role="tab" aria-selected="true" data-l10n="shell-explorer"></button>
        <button id="sideModel" role="tab" aria-selected="false" data-l10n="shell-model"></button>
        <button id="sideViews" role="tab" aria-selected="false" data-l10n="shell-side-diagrams"></button>
      </div>
      <div class="side" id="filesSide">
        <div class="explorer" id="explorer" role="tree" data-l10n-aria-label="shell-files"></div>
      </div>
      <div class="side" id="modelSide" hidden>
        <div class="panehead"><input id="treeSearch" type="search" data-l10n-placeholder="shell-tree-search" data-l10n-aria-label="shell-tree-search-label"></div>
        <div class="tree" id="tree" role="tree" data-l10n-aria-label="shell-model-tree"></div>
      </div>
      <div class="side" id="viewsSide" hidden>
        <div class="panehead"><button id="btnNewDiagram" data-l10n-title="shell-new-diagram-short-hint" data-l10n="shell-new-diagram-plus"></button></div>
        <div class="tree" id="diagramList" role="tree" data-l10n-aria-label="shell-saved-diagrams"></div>
      </div>
    </aside>
    <div class="split" id="splitTree" role="separator" aria-orientation="vertical" data-l10n-aria-label="shell-resize-tree"></div>
    <section class="pane diagrampane" data-l10n-aria-label="shell-diagram">
      <div class="tabbar" id="tabbar" role="tablist" data-l10n-aria-label="shell-diagram-tabs"></div>
      <div class="toolbar">
        <div class="palette" id="palette" role="toolbar" data-l10n-aria-label="shell-palette"></div>
        <div class="spacer"></div>
        <div class="subbar" id="subbar"></div>
        <button id="btnSaveView" data-l10n-title="shell-new-diagram-hint" data-l10n="shell-new-diagram"></button>
        <button id="btnEdge" data-l10n-title="shell-edge-toggle-hint" data-l10n="shell-edge-toggle-ortho"></button>
        <button id="btnLayout" data-l10n-title="shell-layout-hint" data-l10n="shell-layout"></button>
      </div>
      <div class="canvaswrap" id="wrap">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
          <defs id="defs"></defs>
          <g id="vp"><g id="gEdges"></g><g id="gNodes"></g><g id="gOver"></g></g>
        </svg>
        <div class="zoom">
          <button id="zIn" data-l10n-aria-label="shell-zoom-in">+</button>
          <button id="zOut" data-l10n-aria-label="shell-zoom-out">−</button>
          <button id="zFit" data-l10n-aria-label="shell-fit" style="font-size:12px" data-l10n="shell-fit-short"></button>
          <button id="zMini" data-l10n-aria-label="shell-minimap-show" data-l10n-title="shell-minimap-show-hint" aria-pressed="true" style="font-size:11px" data-l10n="shell-minimap"></button>
        </div>
        <div class="toast" id="toast"></div>
        <div class="band" id="band" hidden></div>
        <div class="empty" id="empty" hidden></div>
        <div class="minimap" id="mini" hidden><div class="mhead"><span data-l10n="shell-minimap"></span><button id="miniHide" data-l10n-aria-label="shell-minimap-close" data-l10n-title="shell-close">×</button></div><div class="mbody"><svg id="miniSvg" xmlns="http://www.w3.org/2000/svg"></svg><div class="mvp" id="miniVp" hidden></div></div></div>
        <div class="inspector" id="insp" hidden></div>
      </div>
    </section>
    <div class="split" id="splitText" role="separator" aria-orientation="vertical" data-l10n-aria-label="shell-resize-text"></div>
    <section class="pane textpane" data-l10n-aria-label="shell-text-pane">
      <div class="panehead"><span id="docName" class="docname"></span><span id="textInfo" data-l10n="shell-text-pane"></span><button id="btnEditText" class="editbtn" aria-pressed="false" data-l10n-title="shell-edit-text-hint" data-l10n="shell-edit-text"></button></div>
      <div class="editor">
        <pre id="hl" aria-hidden="true" tabindex="-1"></pre>
        <textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" data-l10n-aria-label="shell-text-pane"></textarea>
      </div>
      <div class="wordline" id="wordLine" aria-live="polite"></div>
      <div class="problems" id="problems"></div>
    </section>
    <section class="nodoc" id="noDoc" hidden aria-labelledby="noDocTitle">
      <b id="noDocTitle" data-l10n="shell-nodoc-title"></b>
      <p id="noDocText"><span data-l10n="shell-nodoc-create"></span><br><span data-l10n="shell-nodoc-sample"></span></p>
      <p id="noDocResume" hidden></p>
      <div class="acts">
        <button data-nodoc="resume" class="primary" hidden data-l10n="shell-nodoc-resume"></button>
        <button data-nodoc="new" class="primary" data-l10n="shell-new-file"></button>
        <button data-nodoc="open" data-l10n="shell-open-file"></button>
        <button data-nodoc="openFolder" hidden data-l10n="shell-open-folder"></button>
        <button data-nodoc="sample" data-l10n="shell-open-sample"></button>
      </div>
    </section>
  </main>
</div>
<div class="ctx" id="ctx" role="menu" hidden></div>
<div class="wordtip" id="wordTip" role="tooltip" hidden></div>
<div class="modal" id="plugins" hidden role="dialog" aria-modal="true" aria-labelledby="pluginsTitle">
  <div class="box">
    <b id="pluginsTitle" data-l10n="shell-plugins-title"></b>
    <div class="plugins" id="pluginsBody"></div>
    <div class="row"><button id="pluginsAdd" class="primary" data-l10n="shell-plugins-add"></button><button id="pluginsClose" data-l10n="shell-close"></button></div>
  </div>
</div>
<div class="modal" id="dialog" hidden role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle">
  <div class="box">
    <b id="dialogTitle"></b>
    <p id="dialogText"></p>
    <div class="ddetail" id="dialogDetail" hidden></div>
    <div class="dpick" id="dialogPick" hidden></div>
    <div class="row" id="dialogButtons"></div>
  </div>
</div>
<div class="modal" id="levelsDialog" hidden role="dialog" aria-modal="true" aria-labelledby="levelsTitle" aria-describedby="levelsText">
  <div class="box">
    <b id="levelsTitle" data-l10n="shell-levels-title"></b>
    <p id="levelsText"></p>
    <div class="lvlist" id="levelsList"></div>
    <div class="row"><button type="button" id="levelsClose" class="primary" data-l10n="shell-close"></button></div>
  </div>
</div>
<div class="modal" id="exportDialog" hidden role="dialog" aria-modal="true" aria-labelledby="exportTitle" aria-describedby="exportText">
  <form class="box" id="exportForm">
    <b id="exportTitle" data-l10n="shell-export-title"></b>
    <p id="exportText" data-l10n="shell-export-text"></p>
    <label class="field"><span data-l10n="shell-export-name"></span><input id="exportName" type="text" autocomplete="off" spellcheck="false"></label>
    <label class="field"><span data-l10n="shell-export-format"></span><select id="exportFormat"></select></label>
    <label class="field" id="exportRangeField"><span data-l10n="shell-export-range"></span><select id="exportRange"><option value="all" data-l10n="shell-export-range-all"></option><option value="selection" data-l10n="shell-export-range-selection"></option></select></label>
    <label class="field" id="exportScaleField"><span data-l10n="shell-export-scale"></span><select id="exportScale"></select></label>
    <label class="field" id="exportBgField"><span data-l10n="shell-export-bg"></span><select id="exportBg"><option value="white" data-l10n="shell-export-bg-white"></option><option value="transparent" data-l10n="shell-export-bg-transparent"></option></select></label>
    <div class="row"><button type="submit" id="exportOk" class="primary" data-l10n="shell-export-ok"></button><button type="button" id="exportCopy" data-l10n="shell-export-copy"></button><button type="button" id="exportCancel" data-l10n="shell-cancel"></button></div>
  </form>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
